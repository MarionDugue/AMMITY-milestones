<nav class="sidebar">
    <div class="sidebar-header">
        <h2>AMMITY</h2>
    </div>
    <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}">Timeline</a></li>
        <li><a href="{{ '/menstruation' | relative_url }}">Learning about menstruation</a></li>

        <!-- Collapsible posts section -->
        <li class="nav-collapsible">
            <button class="nav-collapse-btn" onclick="toggleNav()" aria-expanded="false">
                Posts
                <span class="nav-arrow">▾</span>
            </button>
            <ul class="nav-sub" id="navPostList">
{                % for post in site.posts %}
                <li>
                    <a href="{{ post.url | relative_url }}">
                        <span class="nav-post-date">{{ post.date | date: "%b %Y" }}</span>
                        {{ post.title }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </li>

    </ul>
</nav>

<script>
function toggleNav() {
    const list = document.getElementById('navPostList');
    const btn = document.querySelector('.nav-collapse-btn');
    const isOpen = list.classList.contains('open');
    list.classList.toggle('open');
    btn.setAttribute('aria-expanded', !isOpen);
}
</script>
