---
layout: default
---
<div class="timeline-navigation">
    <a href="{{ '/' | relative_url }}" class="back-arrow-link">
        <svg class="arrow-icon" viewBox="0 0 24 24">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Back to Timeline</span>
    </a>
</div>

<article class="milestone-detail">
    <header class="milestone-header">
        <span class="milestone-date">{{ page.date | date: "%B %d, %Y" }}</span>
        <h1>{{ page.title }}</h1>
    </header>

    <div class="milestone-body">
        {{ content }}
    </div>
</article>
