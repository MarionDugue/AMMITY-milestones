<h1>Resources & Articles</h1>
<ul style="list-style: none; padding: 0;">
    {% for article in site.articles %}
    <li style="margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem;">
        <a href="{{ article.url | relative_url }}" style="text-decoration: none; color: inherit;">
            <h2>{{ article.title }}</h2>
            <p>{{ article.excerpt | strip_html | truncate: 160 }}</p>
        </a>
    </li>
    {% endfor %}
</ul>
